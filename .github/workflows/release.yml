# 发版（技术方案 §14.4）。发版的事归 Claude 做，更新说明也是它写
#
#   1. pnpm bump 0.2.0，在 src/content/changelog.md 最上面写「## 0.2.0 · 日期」那一节，提交
#   2. git tag v0.2.0 && git push origin master v0.2.0
#   3. 这里检查版本和更新说明 → 四个打包任务（Windows、macOS 两种芯片、Linux）、用 Secrets 里的私钥签名，
#      传进一个草稿 Release（安装包、.sig、latest.json；更新说明就是 changelog 那一节）
#   4. 四个都成了：GitHub 的草稿转成正式发布（打 tag 后十几分钟上线）
#   5. 同时镜像到 Gitee：代码和 tag、发行版，只传自动更新要的包（从 GitHub 的机器传 Gitee 很慢，
#      11 MB 要好几分钟），都传完最后才把 updater 发行版里的 latest.json 换成新版 —— 国内用户晚一点收到更新。
#      应用一个地址说「已经最新」也会接着问 GitHub（update.rs），所以 Gitee 慢不耽误别人；挂了就重跑这一个任务
#
# 试打包：Actions 页面选「发版」→ Run workflow。只打包、签名，安装包作为 Artifacts 下载，不建 Release、
# 不查 changelog，顺带看一眼 Gitee 的令牌能不能用 —— 改了打包配置以后先这样跑一遍
#
# 要三个 Secret：TAURI_SIGNING_PRIVATE_KEY（私钥文件的内容）、TAURI_SIGNING_PRIVATE_KEY_PASSWORD、
# GITEE_TOKEN（Gitee 私人令牌，要 projects 权限）
name: 发版

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  # Gitee 上的镜像仓库（tauri.conf.json 的第一个更新地址也指向它）
  GITEE_REPO: hyxzs111111/on-the-way

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: 检查版本和更新说明
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.notes.outputs.version }}
      notes: ${{ steps.notes.outputs.notes }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # tag、package.json、Cargo.toml 的版本一致，changelog 最上面是这一版：不对就不发。试打包不查
      - name: 版本号和更新说明
        id: notes
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
            node scripts/release-notes.mjs "$version" > notes.md
          else
            version="$(node -p "require('./package.json').version")"
            echo "试打包（$GITHUB_REF_NAME），不发布" > notes.md
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          {
            echo "notes<<RELEASE_NOTES_EOF"
            cat notes.md
            echo "RELEASE_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: 类型检查和前端测试
        run: |
          pnpm exec tsc --noEmit
          pnpm test

  build:
    name: 打包 ${{ matrix.name }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            args: ""
          - name: macOS (Apple 芯片)
            os: macos-latest
            args: --target aarch64-apple-darwin
            rust-targets: aarch64-apple-darwin
          - name: macOS (Intel)
            os: macos-latest
            args: --target x86_64-apple-darwin
            rust-targets: x86_64-apple-darwin
          # 22.04：AppImage 里带的 glibc 越老，能跑的发行版越多
          - name: Linux
            os: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Linux 的系统依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev pkg-config

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          key: ${{ matrix.args }}

      - run: pnpm install --frozen-lockfile

      # 打包、签名、建草稿 Release、往里传安装包和 latest.json（几个平台各传各的，latest.json 合成一份）。
      # 试打包时 tagName 是空的：只打包，安装包作为这次运行的 Artifacts，不建 Release
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: pnpm tauri
          args: ${{ matrix.args }}
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: OnTheWay ${{ needs.prepare.outputs.version }}
          releaseBody: ${{ needs.prepare.outputs.notes }}
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          uploadWorkflowArtifacts: ${{ github.ref_type != 'tag' }}

      # macOS 的程序不能链 Homebrew 里的库（用户的 Mac 上没有，应用直接打不开）。
      # OpenSSL 就差点这样（Cargo.toml 里 openssl-sys 那段）。出了这种事这一步变红，那个草稿别发布
      - name: macOS 程序不依赖 Homebrew
        if: runner.os == 'macOS'
        shell: bash
        run: |
          bin="src-tauri/target/${{ matrix.rust-targets }}/release/ontheway"
          otool -L "$bin"
          if otool -L "$bin" | grep -E "/opt/homebrew|/usr/local/(opt|Cellar|lib)"; then
            echo "::error::$bin 链到了 Homebrew 的库，没装 Homebrew 的 Mac 上打不开"
            exit 1
          fi

  # 试打包时看一眼 Gitee 的令牌：真发版时才发现推不上去就晚了
  gitee-check:
    name: Gitee 令牌
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node scripts/gitee-release.mjs check
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}

  # 国内的镜像：代码和 tag 推过去，发行版和安装包传过去，updater 发行版里换上指向 Gitee 的 latest.json
  gitee:
    name: 同步到 Gitee
    needs: [prepare, build]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: 推代码和 tag
        shell: bash
        run: |
          remote="https://${GITEE_REPO%%/*}:${GITEE_TOKEN}@gitee.com/${GITEE_REPO}.git"
          git push --force "$remote" "HEAD:refs/heads/master"
          git push --force "$remote" "refs/tags/${GITHUB_REF_NAME}"

      # 草稿 Release 里的东西（gh 按 tag 找得到草稿）
      - name: 下载这一版的安装包
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --dir release-assets

      # 更新说明经环境变量传：直接写进命令的话，里面的反引号、$ 会被 shell 当命令执行
      - name: 传到 Gitee
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          ASSETS_DIR: release-assets
          NOTES: ${{ needs.prepare.outputs.notes }}
        run: |
          printf '%s\n' "$NOTES" > notes.md
          NOTES_FILE=notes.md node scripts/gitee-release.mjs publish

  # 不等 Gitee：它慢，而且只影响国内用户晚一点收到更新
  publish:
    name: 正式发布
    needs: [build]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - name: 草稿转成正式发布
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest
