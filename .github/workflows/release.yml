# 发版（技术方案 §14.4）。发版的事归 Claude 做，更新说明也是它写
#
#   1. pnpm bump 0.2.0，在 src/content/changelog.md 最上面写「## 0.2.0 · 日期」那一节，提交
#   2. git tag v0.2.0 && git push origin master v0.2.0
#   3. 这里检查版本和更新说明 → 四个打包任务（Windows、macOS 两种芯片、Linux）、用 Secrets 里的私钥签名，
#      传进一个草稿 Release（安装包、.sig、latest.json；更新说明就是 changelog 那一节）
#   4. 四个都成了：latest.json 的下载地址换成不限流的普通下载地址，GitHub 的草稿转成正式发布（打 tag 后十几分钟上线）
#   5. 同时镜像到 Gitee：代码和 tag、发行版，只传自动更新要的包（从 GitHub 的机器传 Gitee 很慢，
#      11 MB 要好几分钟），都传完最后才把 updater 发行版里的 latest.json 换成新版 —— 国内用户晚一点收到更新。
#      应用一个地址说「已经最新」也会接着问 GitHub（update.rs），所以 Gitee 慢不耽误别人；挂了就重跑这一个任务
#
# 试打包：Actions 页面选「发版」→ Run workflow，mirror 空着。只打包、签名，安装包作为 Artifacts 下载，不建 Release、
# 不查 changelog，顺带看一眼 Gitee 的令牌能不能用 —— 改了打包配置以后先这样跑一遍
#
# 补同步：Run workflow，mirror 填已经发布的 tag（比如 v0.1.0）。不打包，用 master 上最新的脚本把那一版的
# latest.json 改一遍、重新同步到 Gitee（发布以后才发现镜像有问题时用；发布了的 tag 别再挪）
#
# 发完跑 node scripts/verify-release.mjs <版本> 核对两边（只用公开地址，和用户的应用看到的一样）
#
# 要三个 Secret：TAURI_SIGNING_PRIVATE_KEY（私钥文件的内容）、TAURI_SIGNING_PRIVATE_KEY_PASSWORD、
# GITEE_TOKEN（Gitee 私人令牌，要 projects 权限）
name: 发版

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      mirror:
        description: "只把已经发布的这一版重新同步到 Gitee（填 tag，比如 v0.1.0）。空着就是试打包"
        required: false
        default: ""

permissions:
  contents: write

env:
  # Gitee 上的镜像仓库（tauri.conf.json 的第一个更新地址也指向它）
  GITEE_REPO: hyxzs111111/on-the-way

# 同一个 tag 又推了一次（发布前修了东西、把 tag 挪到新的提交上）：旧的那次作废，直接停掉
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    name: 检查版本和更新说明
    # 「只同步到 Gitee」不打包：这一步不跑，后面的打包、发布跟着跳过
    if: ${{ !inputs.mirror }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.notes.outputs.version }}
      notes: ${{ steps.notes.outputs.notes }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # tag、package.json、Cargo.toml 的版本一致，changelog 最上面是这一版：不对就不发。试打包不查
      - name: 版本号和更新说明
        id: notes
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
            node scripts/release-notes.mjs "$version" > notes.md
          else
            version="$(node -p "require('./package.json').version")"
            echo "试打包（$GITHUB_REF_NAME），不发布" > notes.md
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          {
            echo "notes<<RELEASE_NOTES_EOF"
            cat notes.md
            echo "RELEASE_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: 类型检查和前端测试
        run: |
          pnpm exec tsc --noEmit
          pnpm test

  build:
    name: 打包 ${{ matrix.name }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            args: ""
          - name: macOS (Apple 芯片)
            os: macos-latest
            args: --target aarch64-apple-darwin
            rust-targets: aarch64-apple-darwin
          - name: macOS (Intel)
            os: macos-latest
            args: --target x86_64-apple-darwin
            rust-targets: x86_64-apple-darwin
          # 22.04：AppImage 里带的 glibc 越老，能跑的发行版越多
          - name: Linux
            os: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Linux 的系统依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev pkg-config

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          key: ${{ matrix.args }}

      - run: pnpm install --frozen-lockfile

      # 打包、签名、建草稿 Release、往里传安装包和 latest.json（几个平台各传各的，latest.json 合成一份）。
      # 试打包时 tagName 是空的：只打包，安装包作为这次运行的 Artifacts，不建 Release
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: pnpm tauri
          args: ${{ matrix.args }}
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: OnTheWay ${{ needs.prepare.outputs.version }}
          releaseBody: ${{ needs.prepare.outputs.notes }}
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          uploadWorkflowArtifacts: ${{ github.ref_type != 'tag' }}

      # macOS 的程序不能链 Homebrew 里的库（用户的 Mac 上没有，应用直接打不开）。
      # OpenSSL 就差点这样（Cargo.toml 里 openssl-sys 那段）。出了这种事这一步变红，那个草稿别发布
      - name: macOS 程序不依赖 Homebrew
        if: runner.os == 'macOS'
        shell: bash
        run: |
          bin="src-tauri/target/${{ matrix.rust-targets }}/release/ontheway"
          otool -L "$bin"
          if otool -L "$bin" | grep -E "/opt/homebrew|/usr/local/(opt|Cellar|lib)"; then
            echo "::error::$bin 链到了 Homebrew 的库，没装 Homebrew 的 Mac 上打不开"
            exit 1
          fi

  # 试打包时看一眼 Gitee 的令牌：真发版时才发现推不上去就晚了
  gitee-check:
    name: Gitee 令牌
    if: ${{ github.ref_type != 'tag' && !inputs.mirror }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node scripts/gitee-release.mjs check
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}

  # 国内的镜像：代码和 tag 推过去，发行版和更新包传过去，updater 发行版里换上指向 Gitee 的 latest.json。
  # 打 tag 时跟在打包后面；手动 Run workflow 填了 mirror 时只做这一件（用 master 上最新的脚本，补同步已经发布的版本）
  gitee:
    name: 同步到 Gitee
    needs: [build]
    if: ${{ !cancelled() && (inputs.mirror || (github.ref_type == 'tag' && needs.build.result == 'success')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.mirror || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: 推代码和 tag
        shell: bash
        run: |
          remote="https://${GITEE_REPO%%/*}:${GITEE_TOKEN}@gitee.com/${GITEE_REPO}.git"
          git push --force "$remote" "HEAD:refs/heads/master"
          git push --force "$remote" "refs/tags/${TAG}"

      # GitHub Release 里的东西（还是草稿也找得到）；更新说明就用它的正文（和 changelog 那一节一样）
      - name: 下载这一版的安装包和更新说明
        shell: bash
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir release-assets
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body > notes.md

      - name: 传到 Gitee
        shell: bash
        env:
          ASSETS_DIR: release-assets
          NOTES_FILE: notes.md
        run: SHA="$(git rev-list -n 1 "$TAG")" node scripts/gitee-release.mjs publish

  # 不等 Gitee：它慢，而且只影响国内用户晚一点收到更新。
  # 手动填了 mirror 时也跑前一步（补改已经发布的那一版的 latest.json），但不再动发布状态
  publish:
    name: 正式发布
    needs: [build]
    if: ${{ !cancelled() && (inputs.mirror || (github.ref_type == 'tag' && needs.build.result == 'success')) }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.mirror || github.ref_name }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # tauri-action v1 写的下载地址是 api.github.com 的接口地址：不登录每个 IP 每小时只能调 60 次，
      # 国内很多人共用一个出口 IP，一起查更新就 403。换成不限次数的 github.com/…/releases/download/…
      - name: latest.json 换成不限流的下载地址
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern latest.json --dir gh-latest --clobber
          node scripts/github-latest.mjs gh-latest/latest.json "$GITHUB_REPOSITORY" "$TAG"
          gh release upload "$TAG" gh-latest/latest.json --repo "$GITHUB_REPOSITORY" --clobber

      - name: 草稿转成正式发布
        if: github.ref_type == 'tag'
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
