[package]
name = "odea"
version = "0.6.1"
description = "笔记、待办、目标与日历一体的个人效率工具"
authors = ["Odea"]
edition = "2021"
rust-version = "1.91"

[features]
default = ["desktop-runtime"]
desktop-runtime = [
  "dep:tauri",
  "dep:tauri-specta",
  "dep:tauri-plugin-opener",
  "dep:tauri-plugin-dialog",
  "dep:tauri-plugin-window-state",
  "dep:tauri-plugin-single-instance",
  "dep:tauri-plugin-updater",
  "dep:tauri-plugin-deep-link",
  "tauri/wry",
  "tauri/compression",
  "tauri/common-controls-v6",
  "tauri/dynamic-acl",
  "tauri/x11",
  "tauri/dbus",
]
# capabilities/default.json 引用了 opener / window-state 的权限，tauri-build 生成 ACL 时
# 要能找到这两个插件，所以导出绑定也得带上它们
typegen = [
  "dep:tauri",
  "dep:tauri-specta",
  "tauri/test",
  "dep:tauri-plugin-opener",
  "dep:tauri-plugin-dialog",
  "dep:tauri-plugin-window-state",
  "dep:tauri-plugin-updater",
]

[lib]
# 桌面端二进制和未来的移动端共用这个 lib
name = "odea_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# protocol-asset：笔记里 `![](C:\…\a.png)` 这类本机图片走 asset 协议（tauri.conf.json
# 里开了 assetProtocol）。必须写在这一行的 features 里 —— tauri-build 只核对这里，
# 写在上面 [features] 里的话，不经 tauri CLI 直接 cargo build / 导出绑定都会被它拦下。
tauri = { version = "2", default-features = false, features = ["protocol-asset"], optional = true }
tauri-plugin-opener = { version = "2", optional = true }
# 「更换笔记文件夹」的选择文件夹对话框和确认框（只在 Rust 里调，前端不需要权限）
tauri-plugin-dialog = { version = "2", optional = true }
tauri-plugin-window-state = { version = "2", optional = true }
# 自动更新（技术方案 §14.4）：检查、下载、安装都在 Rust 里调，前端不需要权限。
# TLS 用系统的，和 ureq 一样不带 rustls / ring。2.13 起要 tauri 2.12，这里还是 2.11，先停在 2.12
tauri-plugin-updater = { version = "~2.12", default-features = false, features = ["native-tls"], optional = true }
# 协作的邀请链接 odea://join/…（docs/协同编辑.md §8.1）：点开就打开 Odea。只在 Rust 里用，前端不需要权限
tauri-plugin-deep-link = { version = "2", optional = true }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 「搬过去」跨盘时，复制核对完把原来的笔记文件夹放进回收站（boot::move_vault），不直接删。
# Windows 上带 FOF_WANTNUKEWARNING：那个盘没有回收站时系统先问一句，不会悄悄删掉
trash = "5"
# 改名前（OnTheWay）的数据目录在哪：和 tauri::path 一样按 dirs 找（old_name.rs）。依赖树里本来就有
dirs = "6"

# --- 数据层 ---
# 文件是真相（仓库文件夹里的 .md），SQLite 只做可以重建的索引，外加读旧版的库。
# bundled 从源码编译 SQLite，自带 FTS5，且不依赖系统 SQLite 版本 ——
# 否则 Windows / macOS 上的版本差异会让 FTS 行为不一致
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
# 监听仓库文件夹：外部程序改了文件，索引跟上、前端刷新
notify = "8"
# 搬旧数据时把文件的修改时间设回原来的「上次更新」
filetime = "0.2"

# --- 搜正文 ---
# 全局搜索（commands::find_in_vault）的正则、大小写不敏感的匹配。依赖树里本来就有（tauri-utils 等），
# 不多占体积。以前这里是 jieba 分词，词典常驻 40 多 MB，只给一个界面没在用的全文索引用（技术方案 §6）
regex = "1"

uuid = { version = "1", features = ["v7", "serde"] }
# 粘贴的图片从前端以 base64 传过来（见 commands::vault_attach）
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
once_cell = "1"

# --- 多设备同步（技术方案 §5.9）---
# libgit2 编译进应用：默认用户没装 git。只开 https —— Windows 走 WinHTTP、macOS 走系统 TLS，
# 不带 OpenSSL；不要 ssh，只用令牌。0.21 起默认 features 是空的，https 必须显式写
git2 = { version = "0.21", default-features = false, features = ["https", "vendored-libgit2"] }
# GitHub 设备码登录、GitHub / Gitee 的接口。TLS 用系统的（Windows SChannel、macOS Security），
# 不带 rustls / ring；代理自己找好传进去（sync/proxy.rs）
ureq = { version = "3.4", default-features = false, features = ["native-tls", "json"] }
# 令牌放系统钥匙串：keyring-core + 各平台自己的存储（keyring 4 的 v1 会顺带一个数据库存储，用不上）
keyring-core = "1"

# --- 多人协同（docs/协同编辑.md）---
# iroh：按公钥拨号的 QUIC，端到端加密。不要默认 features：metrics 用不上；它自带的端口映射
# 没配中继时根本不会去要（socket.rs 里中继表为空就整段跳过），所以端口映射自己驱动（下面的 portmapper）。
# QUIC 的 TLS 绕不开 rustls，这里用 ring（同步那边仍然走系统 TLS，不受影响）。
# unstable-net-report：配了中继时拿网络报告（到中继的延迟、UDP 通不通、公网地址），测试中继和
# 分享前自检用。它不受语义化版本保护，所以锁在 1.3.x：升 iroh 时先看 Endpoint::net_report 变没变
iroh = { version = "~1.3", default-features = false, features = ["tls-ring", "unstable-net-report"] }
# 局域网里按公钥找到对方的地址（mDNS），也给「附近」列表用
iroh-mdns-address-lookup = "0.6"
# 自己配的中继（设计 §6）：RelayQuicConfig 这些 iroh 没有转出来；url 拿来规范化中继地址。依赖树里本来就有
iroh-relay = { version = "~1.3", default-features = false }
url = "2"
# 问自家路由器要一个公网端口（UPnP / NAT-PMP / PCP，设计 §5.2）。和 iroh 1.3 内部用的是同一版
portmapper = { version = "0.19", default-features = false }
# 网卡和子网：访客连不上时判断「是不是在同一个网络里」（设计 §8.5）。iroh 依赖树里本来就有
netwatch = "0.19"
# 订阅 mDNS 的发现事件（Stream）：访客连不上时看「同一个网络里能不能看到主持人」。依赖树里本来就有
n0-future = "0.3"
# 自签名证书的中继按指纹认（设计 §6.2）：要自己实现 rustls 的证书校验。iroh 依赖树里本来就有
rustls = { version = "0.23", default-features = false, features = ["std"] }
# iroh 跑在 tokio 上；Tauri 自己也用它，同一个运行时
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "time", "macros"] }
# 控制消息的编码（设计 §7.4：很小的结构，不用 JSON）、邀请链接的 base32、握手的 HMAC
postcard = { version = "1", default-features = false, features = ["use-std"] }
data-encoding = "2"
ring = "0.17"
# 光标走 QUIC 数据报，iroh 的接口收发的是 Bytes。依赖树里本来就有
bytes = "1"

# --- 类型安全的 IPC 绑定 ---
specta = { version = "=2.0.0-rc.22", features = ["derive"] }
specta-typescript = "=0.0.9"
tauri-specta = { version = "=2.0.0-rc.21", features = ["derive", "typescript"], optional = true }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
# deep-link：应用已经开着时再点 odea:// 链接，交给正在运行的那个实例
tauri-plugin-single-instance = { version = "2", optional = true, features = ["deep-link"] }

[target.'cfg(windows)'.dependencies]
# 同步：令牌放 Windows 凭据管理器；系统代理从注册表读（winreg 依赖树里本来就有）
windows-native-keyring-store = "1.1"
winreg = "0.55"
# 窗口图标从 exe 里嵌的多尺寸图标资源加载（lib.rs 的 use_app_icon_resource）。
# 和 tauri / tao 用的是同一个版本，依赖树里本来就有
# 协作的分享前自检读防火墙规则（collab/firewall.rs）：INetFwPolicy2、枚举规则用的 IEnumVARIANT
# 启动器退场时自己淡出：关掉系统的关窗动画、分层窗口的整窗透明度（workspace.rs 的 fade_out）
windows = { version = "0.61", features = [
  "Win32_Graphics_Dwm",
  "Win32_System_LibraryLoader",
  "Win32_UI_WindowsAndMessaging",
  "Win32_Foundation",
  "Win32_NetworkManagement_WindowsFirewall",
  "Win32_System_Com",
  "Win32_System_Ole",
  "Win32_System_Variant",
] }
# 最小化时让 WebView2 少占内存（memory.rs）。Tauri 只给出 WebView2 的 controller，
# 要 ICoreWebView2_19 得用它自己用的这个版本的绑定
webview2-com = "0.38"

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1", features = ["keychain"] }
# git2 的 https 在所有 unix 上都带着 openssl-sys（libgit2-sys 里一个 openssl_init 引用它），可 macOS 上
# libgit2 走的是系统的 SecureTransport，HTTP 客户端走 Security.framework，谁都不调 OpenSSL。
# 不 vendored 的话它要去找 Homebrew 的 OpenSSL：在 Apple 芯片的机器上交叉编 Intel 版找不到，直接编不过；
# Apple 芯片版找得到，但会动态链上 /opt/homebrew 里的 libssl，没装 Homebrew 的 Mac 上应用打不开。
# 编一份进去（静态库，没人用就不会链进来），发版 CI 里还用 otool 查了一遍
openssl-sys = { version = "0.9", features = ["vendored"] }

[dev-dependencies]
tempfile = "3"
# 协作的测试在进程里起一台真的中继（官方 iroh-relay 的服务端，自签名证书）
iroh-relay = { version = "~1.3", features = ["server", "test-utils"] }

# 调试版：依赖不带调试信息。测试程序的模块一多，MSVC 的链接器就写不下 PDB（LNK1140，2026-10-21 加 Loro 时撞上的）；
# 依赖的调试信息平时也用不上
[profile.dev.package."*"]
debug = false

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
incremental = false

[[example]]
name = "export_bindings"
required-features = ["typegen"]
